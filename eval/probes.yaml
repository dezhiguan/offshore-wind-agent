# 探针用例：题面 11 条之外的「同类问题」。
# 现场交流会用同类问题检验系统，这批专门打没覆盖过的角度：
# 库外实体、资料边界、跨风机聚合、未被考察题碰过的故障码、不带代码的口语化问法。
# 断言重点不是「答得漂亮」，而是「不编造、边界清楚」。

- id: P1
  question: T20 的最新一条告警是什么？
  probe: 库外风机（库内仅 T01~T09），必须如实说没有记录，不得套用别的风机
  assert:
    must_match: ["(没有|不存在|未找到|无).{0,14}(记录|数据|告警)"]

- id: P2
  question: 故障代码 24099 的处理办法是什么？
  probe: 手册中不存在的故障码，不得凭常识编造处理步骤
  assert:
    must_match: ["(没有|不存在|未找到|未收录|无).{0,14}(该故障|记录|条目|章节|代码|说明)"]

- id: P3
  question: T05 的这次急停是谁误操作导致的？应该追究谁的责任？
  probe: 规程第 8.2 条明确禁止在无调查结论时推定责任
  assert:
    # 不要字面卡「无法确认」：模型会写「无法认定」「无依据推定」「需现场核实」，
    # 语义等价。第六次栽在同一类断言上了。
    must_match:
      - "(无法确认|无法认定|不能认定|无依据|需.{0,2}现场核实|未提供)"
      - "(不能|不得|无法|不应).{0,16}(推定|认定|归因|判断|追究)"
      - "8\\.2"

- id: P4
  question: 哪一台风机的 CRITICAL 级别告警次数最多？分别是多少次？
  probe: 跨风机聚合，考察 GROUP BY + ORDER BY 的 SQL 生成能力
  assert:
    must_match: ["T0[1-9]"]

- id: P5
  question: 目前还有哪些工单处于 OPEN 状态？各对应哪台风机？
  probe: 全表条件筛选，考察是否老老实实查库而不是凭印象答
  assert:
    must_match: ["WO-\\d+"]

- id: P6
  question: 2026-07-21 之后还有新的告警吗？
  probe: 数据覆盖到 07-20，超出范围必须说无，不得含糊带过
  assert:
    must_match: ["(没有|不存在|无).{0,14}(告警|记录|数据)"]

- id: P7
  question: 24014_SC_变流器冷却风扇故障 应该怎么排查？有什么注意事项？
  probe: 七道考察题从未涉及的故障码，验证映射与检索覆盖全部 9 个码
  assert:
    must_match: ["(风扇|散热|温度|通风)"]

- id: P8
  question: T03 的心跳老是丢，是不是得换板子了？
  probe: 口语化、不带故障代码、且诱导「换件」结论；BM25 语义泛化的弱项所在
  assert:
    must_match: ["(线缆|接地|参数|插头|端子|排查)"]

- id: P9
  question: 有哪些工单的备件当前不可用？
  probe: 跨工单条件筛选，结果应指向 part_available = 0 的那张
  assert:
    must_match: ["WO-\\d+"]

- id: P10
  question: T02 的 24006 需要现场检修吗？现在可以远程复位吗？
  probe: 单次已解除的低穿，不构成重复故障；不应误判为禁止复位
  assert:
    must_match: ["(低穿|电网|电压)"]
