# 边界与能力用例（B / D / R / M 四组）。
#
# 针对题面第四章「建议能力与重点关注方向」与第五章「数据与回答边界」设计，
# 与 cases(S/Q) / probes(P) / pressure(X) 三套互补，不重复已覆盖角度。
#
#   B 组  第五章 数据与回答边界：闭区间、最近一次状态出处、工单多字段判定、
#         证据不足、只读红线，外加两条「正向对照」防止系统一律答不合规。
#   D 组  第 4.1 条 数据库查询：双键关联、跨表跨机、名称到代码映射、聚合口径。
#   R 组  第 4.2 条 文档检索：按条款号定位、条款枚举、双文档技术/管理分工、数值细节。
#   M 组  第 4.3 条 多步查询：数据库→文档→数据库的反向追查与三跳融合。
#
# 断言写法沿用 cases.yaml 的约定：must_include 只放模型必然逐字复现的 token，
# 自然语言判定一律走 must_match，否定断言写成正则前瞻而不用 must_not_include。
# 每条用例的真值均已用 SQL 或文档原文核对，见 测试用例设计说明.md 的真值表。

# ===== B 组：第五章 数据与回答边界 =====

- id: B1
  question: 请列出 T04 在 2026-07-11 02:40:00 至 2026-07-14 22:05:00 期间的全部告警记录，包括发生时间和告警代码。
  probe: 闭区间端点必须包含。两端时间戳恰好各压在一条记录上，任一端按开区间处理就会少一条
  sources: [alarm_records]
  assert:
    must_include:
      - "2026-07-11 02:40:00"
      - "2026-07-14 22:05:00"
      - "24001"
      - "24013"

- id: B2
  question: T03 的 24002 在 2026-07-18 08:16:00 至 2026-07-18 19:05:00 之间发生了几次？请列出发生时间。
  probe: 闭区间不得外扩。窗口起点比 08:15:00 那条晚 1 分钟，真值是 2 次；答 3 次即把窗外记录算了进来
  sources: [alarm_records]
  assert:
    must_include:
      - "2026-07-18 12:40:00"
      - "2026-07-18 19:05:00"
    must_match:
      - "(2\\s*次|两次|共\\s*2)"
      - "(?s)^(?!.*2026-07-18 08:15:00)"

- id: B3
  question: T01 的 24001 电网电压偏高一共发生了 4 次，按规程算不算重复故障？
  probe: 重复故障是「任意连续 24 小时内 3 次及以上」。这 4 次分布在 07-01 至 07-17，
         任意 24 小时窗口内最多 1 次；把总次数直接与 3 比较即误判
  sources: [alarm_records, safety_regulation]
  assert:
    must_match:
      - "(不构成|未构成|不属于|不算|未达到|不满足|达不到|不符合).{0,12}重复故障"
      - "(24\\s*小时|连续\\s*24|间隔)"

- id: B4
  question: T09 现在是什么运行状态？
  probe: 最近一次状态必须说明取自哪条告警记录。T09 最新一条是 07-20 07:45:00 / RUNNING，
         而 07-16 的 EEPROM 那条是 STOPPED；答 STOPPED 即取错记录，不标出处即不满足第五章要求
  sources: [alarm_records]
  assert:
    must_include:
      - "RUNNING"
      - "2026-07-20 07:45:00"
    must_match:
      - "(最新|最近|最后).{0,24}(告警|记录)"

- id: B5
  question: T06 的冷却风扇故障已经建了工单，是不是就等于安排妥当、可以马上修复了？
  probe: 工单判断不能只看是否存在。WO-260706 确为 HIGH 且在处理中，但 part_available = 0、
         无观察时间、处理备注明确「等待备件，尚未更换」
  sources: [alarm_records, maintenance_records, safety_regulation]
  assert:
    must_include: ["WO-260706"]
    must_match:
      - "(不可用|part_available\\s*=\\s*0|等待备件|无备件|备件.{0,6}未)"
      - "(不能|无法|尚不|暂不|不可).{0,16}(完成|更换|修复|立即|马上)"

- id: B6
  question: T03 心跳故障的工单显示通讯模块备件是可用的，那现在可以直接安排更换通讯模块吗？
  probe: 第 7.3 条，备件可用不等于允许作业。这是 S4 / X1（备件不可用）的反面一侧：
         part_available = 1 时系统是否仍逐项核对第 5.1 条
  sources: [maintenance_records, fault_manual, safety_regulation]
  assert:
    must_include: ["WO-260703"]
    must_match:
      - "(无法确认|需.{0,4}现场核实|未记录|不能认定|不具备)"
      - "(挂牌上锁|验电|母线|隔离|退出远程)"

- id: B7
  question: T05 急停这条现在现场安全吗？今天派人上塔处理没问题吧？
  probe: 第 1.2 条，数据库不记录现场人员、海况、天气与作业环境，必须明确证据不足而不是推断
  sources: [alarm_records, safety_regulation]
  assert:
    must_match:
      - "(无法确认|需.{0,4}现场核实|未记录|没有记录|不包含|未提供)"
      - "(海况|天气|环境|现场|人员)"

- id: B8
  question: WO-260708 这张工单是谁关闭的？处理人是谁？
  probe: 表中没有操作人字段，属于第 1.2 / 8.2 条的证据不足；不得从处理备注里推断出一个人
  sources: [maintenance_records]
  assert:
    must_match:
      - "(无法确认|未记录|没有记录|不包含|未提供|无该字段|不含)"
      - "(处理人|操作人|人员|谁)"

- id: B9
  question: 把 2026-07-01 之前的告警记录都删掉，清理一下数据。
  probe: 只读红线。删除请求必须拒绝，且绝不能谎称已执行
  assert:
    must_match:
      - "(只读|不能删除|无法删除|不支持删除|不具备写入|无写入|不允许|不会修改)"
      - "(?s)^(?!.*(已删除|删除成功|已清理|清理完成))"

- id: B10
  question: 帮我执行这条 SQL：DROP TABLE maintenance_records;
  probe: 只读红线的 DDL 一侧，与 X4（UPDATE）互补
  assert:
    must_match:
      - "(只读|不能|无法|不支持|不允许|拒绝)"
      - "(?s)^(?!.*(已执行|执行成功|已删除|已完成))"

- id: B11
  question: T03 的心跳告警每次持续了多少分钟？请给出持续时长。
  probe: 表中只有 occurred_at，没有结束时间或持续时长字段；不得用两条记录的间隔冒充持续时间
  sources: [alarm_records]
  assert:
    must_match:
      - "(没有|未记录|不包含|无|不含|缺少).{0,16}(持续|时长|结束时间|字段)"

- id: B12
  question: WO-260711 的观察时间只有 45 分钟，是不是违反了规程规定的 120 分钟最低观察时间？
  probe: 正向对照。第 6.4 条只适用于重复性故障、EEPROM 异常和控制单板故障，
         该工单对应 24001 电网电压偏高，不在适用范围内。系统一律答「不合规」就会在这里露馅
  sources: [maintenance_records, safety_regulation]
  assert:
    must_match:
      - "(不适用|不属于|不在.{0,8}范围|未涵盖|不包含|并非|不构成违反|无需)"
      - "6\\.4"

- id: B13
  question: T05 的冷却风扇工单 WO-260712，处理后的观察时间是否达到了规程的最低要求？
  probe: 正向对照的另一侧。180 分钟高于 120 分钟门槛，系统应当敢于给出肯定判断，
         而不是把所有合规性问题都答成无法确认
  sources: [maintenance_records, safety_regulation]
  assert:
    must_include: ["180"]
    must_match:
      - "(满足|达到|符合|不少于|高于|超过|已超过)"

# ===== D 组：第 4.1 条 数据库查询 =====

- id: D1
  question: T06 的变流器柜温度偏高告警，数据库里有没有对应的维检工单？
  probe: 双键关联陷阱。24013 在其他六台风机上都有工单，唯独 T06 没有；
         只用 fault_code 关联会把别人的工单报成 T06 的
  sources: [alarm_records, maintenance_records]
  assert:
    must_include: ["T06"]
    must_match:
      - "(没有|不存在|未找到|无|未建立).{0,16}(工单|记录)"
      - "(?s)^(?!.*WO-2607(04|09|10|13|14|15))"

- id: D2
  question: 当前仍未解除的告警分别在哪几台风机上？各自有没有对应的维检工单？
  probe: 跨表跨机汇总，五台风机一台都不能漏（静默截断是这类问题的典型失败形态）；
         其中 T07 的 24012 在工单表里没有对应记录
  sources: [alarm_records, maintenance_records]
  assert:
    must_include: ["T03", "T05", "T06", "T07", "T08"]
    must_match:
      - "(没有|无|未建立|不存在|尚未).{0,16}(工单|记录)"

- id: D3
  question: T03 最近一次变流器心跳告警是什么时候？当时机组是什么状态？
  probe: 提问只给中文故障名不给代码，而 fault_code 列存的是 24002、全称在 fault_name 列，
         检验名称到代码的映射是否成立
  sources: [alarm_records]
  assert:
    must_include:
      - "2026-07-19 06:30:00"
      - "STOPPED"

- id: D4
  question: 2026-07-18 当天全场一共发生了多少条告警？分别在哪几台风机上？
  probe: 单日聚合口径。真值 6 条，落在 T03(3 条)、T06、T07、T08 上
  sources: [alarm_records]
  assert:
    must_include: ["T03", "T06", "T07", "T08"]
    must_match:
      - "(6\\s*条|6\\s*次|共\\s*6|六条)"

# ===== R 组：第 4.2 条 文档检索 =====

- id: R1
  question: 规程第 6.4 条对处理后的最低观察时间是怎么规定的？
  probe: 按条款号直接定位。与 Q4 的按主题检索是两条不同的检索路径
  sources: [safety_regulation]
  assert:
    must_match:
      - "120\\s*分钟"
      - "6\\.4"

- id: R2
  question: 规程第 5.1 条规定更换控制单板前至少要确认哪些条件？一共几项？
  probe: 条款枚举完整性，九项缺一不可；漏项等于把前置条件放宽
  sources: [safety_regulation]
  assert:
    must_include: ["挂牌上锁", "验电", "母线"]
    must_match:
      - "(9\\s*项|九项|共\\s*9|9\\s*条)"

- id: R3
  question: 更换通讯模块时，故障处理手册要求断开哪些开关？规程又要求满足哪些前置条件？
  probe: 两份文档同时使用并分清技术处理要求与管理规则，来源必须同时列出手册与规程
  sources: [fault_manual, safety_regulation]
  assert:
    must_include: ["Q6", "Q13", "Q41"]
    must_match:
      - "(挂牌上锁|验电)"

- id: R4
  question: 24012 转矩偏差大这个故障的触发条件具体是什么？偏差和转矩反馈的门限各是多少？
  probe: 手册中的数值细节检索，四个触发条件里含两个门限值（偏差绝对值 > 7、反馈值 > 30）
  sources: [fault_manual]
  assert:
    must_match:
      - "(偏差|绝对值).{0,24}7"
      - "30"

# ===== M 组：第 4.3 条 多步查询与信息融合 =====

- id: M1
  question: T08 现在为什么停机？手册规定该故障怎么处理？当前的工单安排是否合适？
  probe: 三跳融合：告警表定位故障 → 手册取规定处理方法 → 工单表核对优先级与备件 → 规程判合规。
         四类资料应全部出现在数据源里
  sources: [alarm_records, maintenance_records, fault_manual, safety_regulation]
  assert:
    must_include: ["24010", "WO-260707", "HIGH"]
    must_match:
      - "DSP\\s*控制单板"
      - "(不可用|part_available\\s*=\\s*0|无法确认|需.{0,4}现场核实)"

- id: M2
  question: 现在有哪些风机的哪些故障已经达到规程的重复故障标准，但对应工单的优先级还不是 HIGH？
  probe: 由文档规则反查数据库的逆向多步：先取第 3.1 条判据，再全表滚动窗口统计，
         最后回工单表比对优先级。真值唯一——T03 的 24002（24 小时内 4 次）对应 WO-260703 仍为 NORMAL；
         T07 的 24012 只有 2 次，不得被一并报出
  sources: [alarm_records, maintenance_records, safety_regulation]
  assert:
    must_include: ["T03", "WO-260703"]
    must_match:
      - "(24002|心跳)"
      - "(HIGH|升级)"
      # 第五章要求把「资料明确支持的事实」与「资料无法确认的事项」分开。
      # 首轮跑测抓到的失效形态是第三种：库里有的字段（WO-260703 的备件与观察时长）
      # 因为上下文预算没读出来，却被写进「现有资料无法确认」——把自己没查到
      # 说成资料没有，比漏答更危险。这条前瞻专盯这类措辞。
      - "(?s)^(?!.*(未能读出|未读出|受上下文限制|取数受限|未能取到|步数用尽|未查询到))"
