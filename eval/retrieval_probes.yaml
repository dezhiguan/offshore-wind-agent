# 检索召回探针集。
#
# 为什么要有这份东西：漏召回是**静默**的 —— 链路显示「命中 4 节」，绿的，
# 而该命中的那一节排在第 9、第 12。实测证明单条查询自身分不出漏没漏
# （见 retriever.diagnose 的标定记录），所以召回退化只能靠固定探针集回归来发现。
#
# gold 是可接受的正确小节 id 列表，命中任一即算对。
# 改检索器（分词、停用词、打分、加权）后这份用例必须重跑，
# 分数掉了就是退化，不是"换了个口味"。
#
# 基线（2026-09-17，加入停用词表后）：整体 top4 召回 81%，改前 76%。

# ---------- A 术语原词（对照组：词面高度重合，必须满分） ----------
- group: A
  query: "变流器心跳丢失的触发条件是什么"
  gold: ["24002_SC_变流器心跳"]
- group: A
  query: "禁止远程强制复位的情形有哪些"
  gold: ["4.1"]
- group: A
  query: "重复故障的定义"
  gold: ["3.1"]
- group: A
  query: "工单关闭的必备记录有哪些"
  gold: ["6.1"]
- group: A
  query: "备件不可用时怎么处理"
  gold: ["7.2"]
- group: A
  query: "变流器冷却风扇故障怎么排查"
  gold: ["24014_SC_变流器冷却风扇故障"]
- group: A
  query: "EMERGENCY 工单在什么情况下建立"
  gold: ["2.1"]
- group: A
  query: "单板更换的作业前置条件"
  gold: ["5.1"]

