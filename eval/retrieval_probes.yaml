  gold: ["24011_SC_主变流器EEPROM参数回默认值"]
- group: B
  query: "有人把急停拍下去了，机组紧急停机"
  gold: ["24005_SC_变流器急停"]
- group: B
  query: "柜子里面太热了，机器降功率"
  gold: ["24013_SC_变流器柜温度偏高"]
- group: B
  query: "电网抖了一下，电压掉下去又自己回来了"
  gold: ["24006_SC_变流器低穿激活"]
- group: B
  query: "并网点的电压超标了"
