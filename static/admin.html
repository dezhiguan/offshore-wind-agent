<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>后台管理 · 海上风电机组维检 Agent</title>
<style>
/* ── 设计说明 ────────────────────────────────────────────────
   控制台形态：深色左轨 + 亮色内容区。左轨承担身份与导航，内容区只放数据。
   指标按语义分组并给不同权重——质量门禁是结论，执行健康是过程，
   成本与延迟是代价，上下文红线是水位。四类性质不同，不该长成一样的卡片。
   用量做成带阈值刻度的仪表：数字回答"多少"，仪表回答"离限还有多远"。
   字体全部用系统栈，不引外部字体——现场可能断网。
   ──────────────────────────────────────────────────────── */
:root{
  --rail:#2E4349; --rail-2:#3D565D; --rail-ink:#E9EFF0; --rail-muted:#9DB2B8;
  --ground:#EDF1F2; --surface:#fff; --surface-2:#F3F6F7; --sunken:#E6ECEE;
  --ink:#0C1619; --ink-2:#3B4C53; --muted:#6B7F86;
  --line:#DDE5E7; --line-2:#C9D5D8;
  --accent:#0A6C74; --accent-soft:#E0EFF0;
  --ok:#2A6A4C; --ok-soft:#E3F0E9; --warn:#8C5205; --warn-soft:#FBF0DF;
  --crit:#A3271F; --crit-soft:#F9E7E5;
  /* TOOL 是出现次数最多的一类 span，原先拿 surface-2 当底色，在白卡片上几乎看不出是个徽标。
     不能给它状态色（绿黄红在这个界面里另有含义），改用板岩色：认得出、又不抢 MODEL 的戏。 */
  --tool:#23353C; --tool-soft:#CBD9DE;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
  --mono:"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root{
  --rail:#16262B; --rail-2:#22383F; --rail-ink:#E0EAEC; --rail-muted:#8AA1A8;
  --ground:#0A1114; --surface:#121E22; --surface-2:#16242A; --sunken:#0E181C;
  --ink:#E4EBED; --ink-2:#AFC0C6; --muted:#7E9299;
  --line:#1F2E33; --line-2:#2B3E44;
  --accent:#4FC0C9; --accent-soft:#0D2B2E;
  --ok:#6FC194; --ok-soft:#11261C; --warn:#D49B3E; --warn-soft:#291F11;
  --crit:#E07C73; --crit-soft:#2A1513;
  --tool:#CFDFE4; --tool-soft:#2C4049;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.65 var(--sans);
  -webkit-font-smoothing:antialiased}

/* ── 左轨 ── */
.shell{display:grid;grid-template-columns:1fr;min-height:100%}
@media (min-width:920px){.shell{grid-template-columns:212px minmax(0,1fr)}}
.rail{background:var(--rail);color:var(--rail-ink);padding:22px 16px;display:flex;
  flex-direction:column;gap:22px}
@media (min-width:920px){.rail{position:sticky;top:0;height:100vh}}
.mark{display:flex;align-items:center;gap:9px}
.mark .dot{width:9px;height:9px;border-radius:50%;background:#5FD3DA;flex:0 0 9px;
  box-shadow:0 0 0 3px rgba(95,211,218,.2)}
.mark .t{font-size:13.5px;font-weight:600;letter-spacing:.01em;line-height:1.35}
.mark .t small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--rail-muted);font-weight:400;margin-top:3px}
.nav{display:flex;gap:6px;flex-direction:row;flex-wrap:wrap}
@media (min-width:920px){.nav{flex-direction:column}}
.nav button{font:inherit;display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:9px 11px;cursor:pointer;background:transparent;color:var(--rail-muted);
  border:0;border-radius:8px;transition:background .13s,color .13s}
.nav button:hover{background:var(--rail-2);color:var(--rail-ink)}
.nav button.on{background:var(--rail-2);color:var(--rail-ink)}
.nav button .ic{width:16px;height:16px;flex:0 0 16px;opacity:.8}
.nav button .lb{font-size:13.5px;font-weight:500}
.nav button.on .lb{font-weight:600}
.nav button .lb small{display:block;font-size:10.5px;color:var(--rail-muted);font-weight:400;margin-top:1px}


/* ── 内容 ── */
.body{padding:26px 28px 70px;max-width:1160px}
.top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.top h1{font-size:1.28rem;margin:0;letter-spacing:-.005em}
.top p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.acts{margin-left:auto;display:flex;gap:8px}
button.run{font:inherit;font-size:12.5px;font-weight:500;padding:7px 15px;cursor:pointer;
  border-radius:7px;background:var(--accent);color:#fff;border:0;transition:opacity .13s}
button.run.ghost{background:var(--surface);color:var(--ink-2);border:1px solid var(--line-2)}
button.run:hover:not(:disabled){opacity:.87}
button.run:disabled{opacity:.42;cursor:default}

/* 质量中心的两档口径：离线评测与线上质量。做成分段控件而不是左轨两个条目——
   它们是同一件事的两种量法（有标准答案 / 没有标准答案），并排摆着才好对照；
   各占一个导航位会让人以为是两块互不相干的业务。 */
.tabs{display:flex;gap:4px;background:var(--sunken);border:1px solid var(--line);
  border-radius:10px;padding:4px;margin:-10px 0 24px;width:fit-content;max-width:100%;flex-wrap:wrap}
.tabs button{font:inherit;cursor:pointer;border:0;background:transparent;color:var(--muted);
  padding:8px 16px;border-radius:7px;text-align:left;transition:background .13s,color .13s}
.tabs button:hover{color:var(--ink-2)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.tabs button .tt{display:block;font-size:13px;font-weight:600}
.tabs button.on .tt{color:var(--accent)}
.tabs button .ts{display:block;font-size:10.5px;color:var(--muted);font-weight:400;margin-top:2px}

/* 口径旁白：指标下面那句"这个数字是怎么来的、样本是谁" */
.note{font-size:11.5px;color:var(--muted);line-height:1.7;margin:11px 2px 0}
.note b{color:var(--ink-2)}
.note.warn{color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:9px 12px}
.note.warn b{color:var(--warn)}

/* ── 分节 ── */
section.blk{margin-bottom:26px}
.hd{display:flex;align-items:baseline;gap:10px;margin-bottom:11px}
.hd .n{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);font-weight:600}
.hd .d{font-size:11.5px;color:var(--muted)}
.hd .line{flex:1;height:1px;background:var(--line)}

/* 质量门禁：结论卡，权重最高 */
.gate{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:20px 24px;display:grid;grid-template-columns:1fr;gap:20px}
@media (min-width:760px){.gate{grid-template-columns:auto 1fr;align-items:center;gap:36px}}
.gate .big{font-family:var(--mono);font-size:2.9rem;line-height:1;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;color:var(--ok)}
.gate .big.bad{color:var(--crit)}
.gate .big small{font-size:1.1rem;color:var(--muted);margin-left:2px}
.gate .cap{font-size:12px;color:var(--muted);margin-top:8px}
.gate .cap b{color:var(--ink-2);font-weight:600}
.seg{display:flex;gap:3px;margin-bottom:10px}
.seg i{height:7px;border-radius:2px;background:var(--ok);display:block}
.seg i.bad{background:var(--crit)}
.seg i.warn{background:var(--warn)}
.suites{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.suites span b{font-family:var(--mono);color:var(--ink);font-size:13px;margin-right:3px}

/* 指标网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:12px}
.m{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.m .lb{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.m .lb em{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);font-style:normal;background:var(--surface-2);padding:2px 5px;border-radius:3px}
.m .v{font-family:var(--mono);font-size:1.55rem;font-variant-numeric:tabular-nums;
  margin-top:9px;line-height:1.1;letter-spacing:-.01em}
.m .v small{font-size:.82rem;color:var(--muted)}
.m .s{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5}
.m.good .v{color:var(--ok)} .m.warn .v{color:var(--warn)} .m.bad .v{color:var(--crit)}
.dash{color:var(--muted);font-size:1.1rem}

/* 上下文红线：仪表而非数字 */
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.mt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.mt .row{display:flex;align-items:baseline;gap:8px;margin-bottom:11px}
.mt .row .lb{font-size:12.5px;color:var(--ink-2)}
.mt .row .pc{margin-left:auto;font-family:var(--mono);font-size:1.25rem;font-variant-numeric:tabular-nums}
.mt .row .pc small{font-size:.75rem;color:var(--muted)}
.track{position:relative;height:8px;background:var(--sunken);border-radius:4px;overflow:visible}
.track i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
.track i.near{background:var(--warn)}
/* 试图水位：拒绝不计费，所以它压在实线之外——画成斜纹，区别于真的进了上下文的量 */
.track i.att{background:repeating-linear-gradient(135deg,var(--crit) 0 3px,transparent 3px 6px);
  opacity:.55}
.pc .att{font-size:11px;font-weight:700;color:var(--crit);letter-spacing:0}
.track .lim{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--crit);border-radius:1px}
.mt .foot{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;
  color:var(--muted);margin-top:8px}
.cap-note{font-size:11.5px;color:var(--muted);line-height:1.65;margin-top:12px}


/* 执行进度 */
.runbar{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:0 var(--r) var(--r) 0;padding:14px 18px;margin-bottom:22px;display:none}
.runbar.on{display:block}
/* 执行进度条挂在三个视图之外（loadEval 每次重写 #v-eval，放进去会被冲掉），
   所以换页时要显式收起来——它是离线评测的东西，跟着线上质量一起露脸就是串台。
   用 .hide 而不是清掉 .on：跑完的那份结果得留着，切回来还在。 */
.runbar.hide{display:none}
.runbar .h{font-size:13px;font-weight:600}
.runbar .h span{font-family:var(--mono);font-weight:400;color:var(--muted);margin-left:8px;font-size:12px}
.runbar .cur{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);margin-top:5px;min-height:1.2em}
.prog{height:4px;background:var(--sunken);border-radius:2px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.rlog{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:10px;
  max-height:124px;overflow-y:auto;line-height:1.75}
.rlog b.p{color:var(--ok)} .rlog b.f{color:var(--crit)}

/* 表格 */
.tw{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
  overflow:hidden;margin-bottom:12px}
table{border-collapse:collapse;width:100%;font-size:12.5px;table-layout:fixed}
table th,table td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--line);
  vertical-align:top;white-space:normal;overflow-wrap:anywhere}
thead th{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);background:var(--surface-2);font-weight:600}
tbody tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer;transition:background .1s}
tbody tr.row:hover{background:var(--surface-2)}
tbody tr.row.running{background:var(--warn-soft)}
tbody tr.row.just-pass{background:var(--ok-soft)}
tbody tr.row.just-fail{background:var(--crit-soft)}
td.id{font-family:var(--mono);font-weight:600;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.pill{font-family:var(--mono);font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:3px;
  letter-spacing:.04em}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.no{background:var(--crit-soft);color:var(--crit)}
.pill.cut{background:var(--warn-soft);color:var(--warn)}
.mini{display:inline-block;width:34px;height:4px;border-radius:2px;background:var(--sunken);
  vertical-align:2px;margin-right:6px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--accent)}
.mini i.hot{background:var(--warn)}
.chip{font-family:var(--mono);font-size:9.5px;padding:2px 6px;border-radius:3px;
  background:var(--accent-soft);color:var(--accent);margin:0 4px 3px 0;display:inline-block}
.probe{color:var(--muted);font-size:11.5px;margin-top:3px}
.why{color:var(--crit);font-size:11.5px;font-family:var(--mono);margin-top:3px}

/* 链路追踪：左列表 + 右详情 */
.md{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
@media (min-width:1080px){.md{grid-template-columns:336px minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.panel .ph{padding:16px 18px 13px;border-bottom:1px solid var(--line)}
.panel .ph .t{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.panel .ph .t .live{margin-left:auto;font-family:var(--mono);font-size:9px;font-weight:700;
  letter-spacing:.1em;padding:3px 8px;border-radius:20px;background:var(--ok-soft);color:var(--ok)}
.panel .ph .d{font-size:11.5px;color:var(--muted);margin-top:3px}
.filters{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;
  flex-direction:column;gap:8px;background:var(--surface-2)}
.filters input,.filters select{font:inherit;font-size:12.5px;padding:8px 11px;width:100%;
  background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:7px}
.filters .two{display:flex;gap:8px}
.tlist{max-height:620px;overflow-y:auto}
.ti{display:flex;gap:10px;padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--line);
  transition:background .1s;align-items:flex-start}
.ti:last-child{border-bottom:0}
.ti:hover{background:var(--surface-2)}
.ti.on{background:var(--accent-soft)}
.ti .st{width:20px;height:20px;flex:0 0 20px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:700;margin-top:1px}
.ti .st.SUCCESS{background:var(--ok);color:#fff}
.ti .st.DEGRADED{background:var(--warn);color:#fff}
.ti .st.FAILED{background:var(--crit);color:#fff}
/* 必须 flex：模板字符串里的缩进换行在块级容器中会变成匿名行盒，
   实测把每个列表项从 55px 撑到 154px。flex 布局忽略纯空白节点。 */
.ti .tmain{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.ti .hdr{display:flex;align-items:baseline;gap:8px}
.ti .q{font-size:12.5px;font-weight:500;line-height:1.5;flex:1;min-width:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 元信息必须单行省略：数据源名很长（如「检修作业与安全管理规程」），
   放开换行会把每个列表项撑成三四行，列表就没法扫了 */
.ti .meta{font-size:10.5px;color:var(--muted);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti .sid{font-family:var(--mono);font-size:10px;color:var(--muted);flex:0 0 auto}
/* 来源标：线上问答与回归跑测的链路同在一个列表里，不打标就会被当成同一批流量 */
.src{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.06em;padding:1px 5px;
  border-radius:3px;background:var(--surface-2);color:var(--muted);flex:0 0 auto;white-space:nowrap}
.src.eval{background:var(--accent-soft);color:var(--accent)}
.tlist .none{padding:26px;text-align:center;color:var(--muted);font-size:12.5px}
/* 涨跌标：跟在指标数字后面。颜色按**好坏**给，不按方向给——
   耗时涨了是坏事，准确率涨了是好事，统一用绿色表示"上升"会把人带沟里。 */
.dl{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.02em;
  padding:2px 6px;border-radius:4px;margin-left:8px;white-space:nowrap;vertical-align:.32em}
.dl.good{background:var(--ok-soft);color:var(--ok)}
.dl.bad{background:var(--crit-soft);color:var(--crit)}
.dl.flat{background:var(--surface-2);color:var(--muted)}
.gate .big .dl{font-size:12px;vertical-align:.8em;margin-left:12px}

/* 链路追踪顶部的导航条。这一页是**诊断**不是度量：它该回答「这批留存里有什么、
   该点开哪条」，而不是再出一套聚合指标——同名指标在两个页面上因样本不同给出不同
   数值（这里是最近 50 条混着线上与回归，那里是固定用例集），看的人只会以为系统
   自相矛盾。聚合口径统一归 Agent 质量中心。 */
.tnav{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.tnav .seg{font-size:12px;color:var(--muted);display:flex;align-items:baseline;gap:5px}
.tnav .seg b{font-family:var(--mono);font-size:1.02rem;color:var(--ink);font-variant-numeric:tabular-nums}
.tnav .seg .u{font-family:var(--mono);font-size:11px}
.tnav .bar{width:1px;height:18px;background:var(--line)}
.tnav .grow{flex:1}
.tnav .at{font-family:var(--mono);font-size:11px;color:var(--muted)}
.fchip{font:inherit;font-size:12px;cursor:pointer;display:inline-flex;align-items:baseline;gap:6px;
  padding:5px 11px;border-radius:20px;background:var(--surface-2);color:var(--ink-2);
  border:1px solid var(--line);transition:background .12s,border-color .12s}
.fchip b{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.fchip:hover:not(:disabled){border-color:var(--line-2)}
.fchip:disabled{opacity:.45;cursor:default}
.fchip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.fchip.warn.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.fchip.crit.on{background:var(--crit-soft);border-color:var(--crit);color:var(--crit)}
.fchip.clear{background:transparent;border-style:dashed;color:var(--muted)}

.pager{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.pager .cnt{font-family:var(--mono);letter-spacing:.03em}
.pager .grow{flex:1}
.pager button{font:inherit;font-size:11.5px;padding:5px 13px;border-radius:6px;cursor:pointer;
  background:var(--surface);color:var(--ink-2);border:1px solid var(--line-2);transition:background .12s}
.pager button:hover:not(:disabled){background:var(--surface-2)}
.pager button:disabled{opacity:.4;cursor:default}
.pager select{font:inherit;font-size:11.5px;padding:5px 9px;border-radius:6px;
  background:var(--surface);color:var(--ink-2);border:1px solid var(--line-2)}

.tlist .more{padding:11px;text-align:center;color:var(--muted);font-family:var(--mono);
  font-size:10.5px;letter-spacing:.04em;border-top:1px dashed var(--line);background:var(--surface-2)}
.tlist .more.done{opacity:.66}

.dt{padding:20px 22px}
.dt h3{font-size:1.28rem;margin:0;letter-spacing:-.01em;line-height:1.35}
.dt .ids{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:7px}
.dt .badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.bd{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.05em;
  padding:4px 10px;border-radius:20px;border:1px solid var(--line-2);color:var(--ink-2)}
.bd.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.bd.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.bd.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
/* 回答单开一页看：追踪页要的是「哪一步出了问题」，正文夹在中间会把 span 顶到屏幕外 */
.dt .qline{display:flex;align-items:flex-start;gap:14px}
.dt .qline h3{flex:1 1 auto;min-width:0}
button.viewbtn{flex:0 0 auto;font:inherit;font-size:12.5px;cursor:pointer;padding:6px 13px;
  border:0;border-radius:7px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;
  transition:background .12s,color .12s}
button.viewbtn:hover{background:var(--accent-soft);color:var(--accent)}

/* 回答弹层：留在当前页面看。跳去新标签会把「在看哪一条、卡在哪一步」的上下文丢掉，
   而看完回答十有八九要回来接着看 span。用原生 dialog：ESC 关闭与焦点管理都是白送的。 */
dialog.ansdlg{border:0;padding:0;border-radius:12px;background:var(--surface);color:var(--ink);
  width:min(760px,calc(100vw - 48px));max-height:calc(100vh - 80px);overflow:hidden;
  box-shadow:0 18px 50px rgba(6,16,19,.28)}
dialog.ansdlg::backdrop{background:rgba(10,20,23,.42)}
.ansdlg .top2{display:flex;align-items:flex-start;gap:14px;padding:20px 24px 15px;
  border-bottom:1px solid var(--line)}
.ansdlg .top2 h3{margin:0;font-size:1.06rem;line-height:1.5;overflow-wrap:anywhere}
.ansdlg .top2 .ids{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px;
  overflow-wrap:anywhere}
.ansdlg .x{font:inherit;font-size:17px;line-height:1;cursor:pointer;border:0;background:transparent;
  color:var(--muted);padding:5px 8px;border-radius:7px;flex:0 0 auto}
.ansdlg .x:hover{background:var(--surface-2);color:var(--ink)}
.ansdlg .cont{padding:18px 24px 24px;overflow-y:auto;max-height:calc(100vh - 210px)}
.ansdlg .cont h4{font-size:9.5px;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin:0 0 9px;font-weight:600}
.ansdlg .cont .ans{max-height:none;font-size:13px;line-height:1.85}
.ansdlg .cont .un{background:var(--warn-soft);border-color:transparent}
.anom{background:var(--warn-soft);border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:10px 20px;margin:0}
.anom .t{font-size:11.5px;font-weight:600;color:var(--warn);margin-bottom:5px}
.anom ul{margin:0;padding-left:15px;font-size:11.5px;color:var(--ink-2);line-height:1.6}
.anom li{margin-bottom:2px}
.anom li b{color:var(--ink)}
.strip{display:flex;flex-wrap:wrap;border-top:1px solid var(--line);
  background:var(--surface-2);overflow:hidden}
/* 必须是直接子元素：写成 .strip div 会把格子里的 .v / .x 也当成格子，
   于是数值和小字各自套一层内边距与分隔线——格子被撑到近两倍高，还多出一堆碎框 */
/* basis 压到 118px：五格要能并成一行，落到第二行就会有一格独占整行 */
.strip>div{flex:1 1 118px;min-width:0;padding:9px 13px;
  box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
.strip b{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:3px}
.strip .v{font-family:var(--mono);font-size:.92rem;font-variant-numeric:tabular-nums;
  white-space:nowrap;line-height:1.3}
.strip .x{font-size:10px;color:var(--crit);margin-top:2px;line-height:1.4}
.strip .x.mute{color:var(--muted)}
/* 失败是红的，护栏拒绝与估算单价是黄的：两者性质不同，颜色不能同一档 */
.strip .x.bad,.strip .x b.bad{color:var(--crit)}
.strip .x.warn,.strip .x b.warn{color:var(--warn)}
.strip .x b{font-weight:400}
.dsec{padding:18px 22px 20px}

tr.det td{background:var(--sunken);padding:0}
.dbox{padding:16px 18px;display:none}
tr.det.open .dbox{display:block}
.dbox h4{font-size:9.5px;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin:0 0 8px;font-weight:600}
.dbox h4+*{margin-top:0}
.ans{font-size:12.5px;white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);
  border-radius:7px;padding:12px 14px;margin-bottom:14px;max-height:240px;overflow-y:auto;color:var(--ink-2)}
.pipe{display:flex;align-items:stretch;overflow-x:auto;padding:2px 0 12px}
.pnode{flex:0 0 auto;border:1px solid var(--line);border-radius:8px;padding:9px 13px;
  min-width:94px;background:var(--surface)}
.pnode .n{font-size:11.5px;font-weight:600;line-height:1.3}
.pnode .t{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:3px}
.k-MODEL{background:var(--accent-soft);border-color:var(--accent)}
.k-TOOL{background:var(--tool-soft);border-color:var(--tool)}
.k-GUARD{background:var(--warn-soft);border-color:var(--warn)}
.pnode.st-ERROR{border-color:var(--crit);background:var(--crit-soft)}
.pnode.st-DEGRADED{border-color:var(--warn);background:var(--warn-soft)}
.parrow{flex:0 0 auto;display:flex;align-items:center;padding:0 7px;color:var(--line-2);
  font-family:var(--mono);font-size:12px}
table.spans{font-size:11.5px;background:var(--surface)}
table.spans .spn{font-weight:500;margin-top:4px;line-height:1.4}
table.spans .spd{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:2px}
table.spans thead th{background:var(--surface)}
.tg{font-family:var(--mono);font-size:8.5px;font-weight:700;padding:2px 5px;border-radius:3px;
  white-space:nowrap;letter-spacing:.04em}
.tg.MODEL{background:var(--accent-soft);color:var(--accent)}
.tg.TOOL{background:var(--tool-soft);color:var(--tool)}
.tg.GUARD{background:var(--warn-soft);color:var(--warn)}
.sv{font-family:var(--mono);font-size:9.5px;font-weight:700}
.sv.OK{color:var(--ok)} .sv.ERROR{color:var(--crit)} .sv.DEGRADED{color:var(--warn)}
/* span 详情：默认收起，展开后给完整的输入输出参数 */
button.spx{font:inherit;font-size:10px;line-height:1;cursor:pointer;padding:4px 6px;
  border-radius:5px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted)}
button.spx:hover{border-color:var(--accent);color:var(--accent)}
button.spx.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
tr.sdet{display:none}
tr.sdet.open{display:table-row}
tr.sdet>td{background:var(--sunken);padding:12px 14px}
.sbox{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:900px){.sbox{grid-template-columns:1fr 1fr}}
.sbox .io h5{margin:0 0 6px;font-family:var(--mono);font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);font-weight:600}
.sbox .io h5 em{font-style:normal;letter-spacing:0;text-transform:none;margin-left:7px;
  color:var(--warn);font-weight:400}
.sbox pre{margin:0;font-family:var(--mono);font-size:10.5px;line-height:1.6;color:var(--ink-2);
  background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;
  max-height:300px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.empty{color:var(--muted);font-size:13px;padding:44px 26px;text-align:center;
  background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r)}
.empty a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">

<aside class="rail">
  <div class="mark">
    <span class="dot"></span>
    <span class="t">海上风电维检 Agent<small>管理后台</small></span>
  </div>
  <nav class="nav">
    <button data-v="eval" data-nav="quality" class="on">
      <svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M2 13V7M6 13V3M10 13V9M14 13V5"/></svg>
      <span class="lb">Agent 质量中心<small>离线评测 · 线上质量</small></span>
    </button>
    <button data-v="traces" data-nav="traces">
      <svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="3.5" cy="8" r="1.6"/><circle cx="12.5" cy="4" r="1.6"/>
        <circle cx="12.5" cy="12" r="1.6"/><path d="M5 7.2 11 4.6M5 8.8 11 11.4"/></svg>
      <span class="lb">链路追踪<small>span 明细</small></span>
    </button>
  </nav>
</aside>

<div class="body">
  <div class="top">
    <div>
      <h1 id="vtitle">Agent 质量中心</h1>
      <p id="vsub"></p>
    </div>
    <span class="acts">
      <button class="run" id="runAll">运行全部</button>
      <button class="run ghost" id="runSel">运行选中</button>
    </span>
  </div>
  <div class="tabs" id="qtabs">
    <button data-t="eval" class="on">
      <span class="tt">离线评测</span>
      <span class="ts">固定用例 + 断言 · 判得出对错</span>
    </button>
    <button data-t="online">
      <span class="tt">线上质量</span>
      <span class="ts">真实问答留下的痕迹 · 没有标准答案</span>
    </button>
  </div>
  <section class="view on" id="v-eval"><p class="empty">加载中…</p></section>
  <section class="view" id="v-online" style="display:none"><p class="empty">加载中…</p></section>
  <section class="view" id="v-traces" style="display:none"><p class="empty">加载中…</p></section>
</div>

</div>

<dialog class="ansdlg" id="ansdlg"></dialog>
<script>
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const clip = (s, n) => { s = String(s ?? ''); return s.length > n ? s.slice(0, n) + '…' : s; };
// 模型有时在一个条目里写字面量 \n 而不是真换行；先还原再转义，否则页面上会出现一串 \n。
const text = s => esc(String(s ?? '').replace(/\\n/g, '\n')).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
const $ = s => document.querySelector(s);
// 后台数据是实时的，浏览器会把 GET 响应缓存下来——曾出现「接口已有数据、页面仍显示空」。
const api = p => fetch(p + (p.includes('?') ? '&' : '?') + '_=' + Date.now(),
                       {cache: 'no-store'}).then(r => r.json());
const grade = (v, g, w) => v == null ? '' : (v >= g ? ' good' : v >= w ? ' warn' : ' bad');

/* 与上一轮评测的涨跌。
   单位是刻意分开的：**比率类用百分点（pp），量纲类用相对百分比（%）**。
   准确率从 96 到 99 写成「+3%」会被读成相对变化（实际是 3 个百分点），
   而耗时从 20s 到 22s 写成「+2」毫无意义——两类指标本就不该共用一个单位。 */
const TREND = {
  result_accuracy:  {unit: 'pp', good: 'up'},
  task_completion:  {unit: 'pp', good: 'up'},
  tool_success:     {unit: 'pp', good: 'up'},
  chain_completion: {unit: 'pp', good: 'up'},
  p95_latency_ms:   {unit: '%',  good: 'down'},
  avg_tokens:       {unit: '%',  good: 'down'},
  cost_per_task:    {unit: '%',  good: 'down'},
};
let BASELINE = null, METRICS = {};   // 上一轮快照的 metrics（没有就是首轮）与本轮指标

function delta(key) {
  const cfg = TREND[key];
  if (!cfg || !BASELINE) return '';
  const was = BASELINE[key], now = (METRICS[key] || {}).value;
  if (was == null || now == null) return '';
  const diff = cfg.unit === 'pp' ? now - was : (was ? (now - was) / was * 100 : null);
  if (diff == null) return '';
  // 小于这个幅度当持平：把 0.01pp 的抖动画成红色箭头，等于每轮都在报警
  const eps = cfg.unit === 'pp' ? 0.05 : 0.5;
  if (Math.abs(diff) < eps) return '<span class="dl flat">持平</span>';
  const up = diff > 0;
  const good = (up ? 'up' : 'down') === cfg.good;
  return `<span class="dl ${good ? 'good' : 'bad'}">${up ? '▲' : '▼'} ${
    Math.abs(diff).toFixed(1)}${cfg.unit}</span>`;
}

const hd = (n, d) => `<div class="hd"><span class="n">${n}</span>${
  d ? `<span class="d">${esc(d)}</span>` : ''}<span class="line"></span></div>`;

function metric(label, badge, val, unit, sub, cls, trend) {
  return `<div class="m${cls || ''}">
    <div class="lb">${label}${badge ? `<em>${badge}</em>` : ''}</div>
    <div class="v">${val === null || val === undefined
      ? '<span class="dash">—</span>' : esc(val) + (unit ? `<small>${unit}</small>` : '')}${
      trend || ''}</div>
    <div class="s">${esc(sub || '')}</div></div>`;
}

// 数字回答"多少"，仪表回答"离限还有多远"——上下文用量的重点是后者。
// attempt = 被护栏拒绝的那一刻"想压到的水位"。它不在用量里（拒绝不计费），
// 但它才是唯一能越过阈值的数——只画已计费的覆盖率，撞线永远看不见。
function meter(label, value, limit, foot, attempt) {
  const v = value ?? 0, ratio = Math.min(100, v / limit * 100);
  const hit = attempt != null && attempt > v;
  return `<div class="mt">
    <div class="row"><span class="lb">${label}</span>
      <span class="pc">${hit ? `<span class="att" title="护栏拒绝前试图压到的水位">试图 ${
        attempt.toFixed(1)}%</span> ` : ''}${v.toFixed(1)}<small>%</small></span></div>
    <div class="track">${hit ? `<i class="att" style="width:${Math.min(100, attempt)}%"></i>` : ''}
      <i class="${ratio > 75 || hit ? 'near' : ''}" style="width:${v}%"></i>
      <span class="lim" style="left:${limit}%"></span></div>
    <div class="foot"><span>0</span><span>阈值 ${limit}%</span><span>100</span></div>
    <div class="cap-note">${foot}</div></div>`;
}

// RAG / RULE 是 span 采集时的内部分类，看链路的人只关心"这一步是模型还是工具调用"。
// 只改展示，不动 span.kind 本身——指标口径与用例筛选仍按原分类统计。
const TOOL_KINDS = ['TOOL', 'RAG', 'RULE'];
const kindView = k => TOOL_KINDS.includes(k) ? 'TOOL' : k;

function pipeline(spans) {
  return '<div class="pipe">' + spans.map((s, i) =>
    `${i ? '<span class="parrow">→</span>' : ''}<div class="pnode k-${kindView(s.kind)} st-${s.status}">
      <div class="n">${esc(s.name)}</div><div class="t">${s.elapsed_ms}ms</div></div>`).join('') + '</div>';
}
// 类型并进 Span 列：主从布局下右侧面板只有 ~700px，六列会把摘要挤成竖排。
// 表里给的是摘要（摘要才能一眼扫完一条链路），完整参数放进默认收起的详情行。
// 没有留存原文的那一侧（模型调用的完整提示词）如实说明，不拿摘要冒充全文。
function spanIO(s) {
  const pane = (t, full, brief) => `<div class="io">
    <h5>${t}${full ? '' : '<em>未留存原文，以下为摘要</em>'}</h5>
    <pre>${esc(full || brief || '（无）')}</pre></div>`;
  return `<div class="sbox">${pane('输入', s.input_detail, s.input)}${
    pane('输出', s.output_detail, s.output)}</div>`;
}
function spanTable(spans) {
  return `<div class="tw"><table class="spans">
    <colgroup><col style="width:23%"><col style="width:28%"><col style="width:31%">
      <col style="width:58px"><col style="width:62px"><col style="width:58px"></colgroup>
    <thead><tr><th>Span</th><th>输入摘要</th><th>输出摘要</th>
      <th style="text-align:right">耗时</th><th>状态</th><th style="white-space:nowrap">详情</th></tr></thead>
    <tbody>${spans.map(s => `<tr>
      <td><span class="tg ${kindView(s.kind)}">${kindView(s.kind)}</span>
        <div class="spn">${esc(s.name)}</div>
        ${s.detail ? `<div class="spd">${esc(s.detail)}</div>` : ''}
        ${s.guard ? `<div class="spd">护栏 · ${esc(s.guard)}</div>` : ''}</td>
      <td>${esc(clip(s.input, 130)) || '—'}</td>
      <td>${esc(clip(s.output, 170)) || '—'}</td>
      <td class="num">${s.elapsed_ms}ms</td>
      <td><span class="sv ${s.status}">${s.status}</span></td>
      <td><button class="spx" type="button" title="展开输入输出参数">▸</button></td></tr>
      <tr class="sdet"><td colspan="6">${spanIO(s)}</td></tr>`).join('')}</tbody></table></div>`;
}

// span 表被三处 innerHTML 插入，逐处绑事件容易漏，统一走委托
document.addEventListener('click', e => {
  const b = e.target.closest('button.spx');
  if (!b) return;
  // 用例表那一层也在监听行点击，不拦住会把整条详情一起收起来
  e.stopPropagation();
  b.classList.toggle('on');
  b.textContent = b.classList.contains('on') ? '▾' : '▸';
  b.closest('tr').nextElementSibling?.classList.toggle('open');
});
const miniBar = (v, hot) => v == null ? '—'
  : `<span class="mini"><i class="${hot ? 'hot' : ''}" style="width:${Math.max(3, Math.min(100, v))}%"></i></span>${v.toFixed(1)}%`;

/* ── 离线评测 ──
   固定用例 + 断言：有标准答案，所以这一档可以直接判对错，「结果准确率」
   只在这里出现。线上那一档拿不到标准答案，见 loadOnline。 */
function evalDetail(it) {
  const ev = it.evidence || {};
  const sql = (ev.tables || []).map((t, i) =>
    `<div class="ans">-- 查询 ${i + 1}，命中 ${t.row_count ?? 0} 行\n${esc(t.sql)}</div>`).join('');
  return `<div class="dbox">
    ${it.sources?.length ? `<h4>使用的数据源</h4><div style="margin-bottom:14px">${
      it.sources.map(s => `<span class="chip">${esc(s)}</span>`).join('')}</div>` : ''}
    <h4>回答</h4><div class="ans">${text(it.answer) || '（无）'}</div>
    ${it.unverifiable?.length ? `<h4>现有资料无法确认（${it.unverifiable.length} 项）</h4>
      <div class="ans">${it.unverifiable.map(u => '· ' + text(u)).join('\n')}</div>` : ''}
    ${it.spans?.length ? `<h4>Span 明细${it.cost_cny != null
        ? ` · ${it.model_calls} 次模型调用 · ${it.tokens} tok · ¥${it.cost_cny.toFixed(4)}` : ''}</h4>
      ${pipeline(it.spans)}${spanTable(it.spans)}` : ''}
    ${sql ? `<h4>执行过的 SQL</h4>${sql}` : ''}</div>`;
}
function suiteTable(items) {
  return `<div class="tw"><table>
    <colgroup><col style="width:92px"><col><col style="width:70px"><col style="width:70px">
      <col style="width:74px"><col style="width:104px"><col style="width:104px"></colgroup>
    <thead><tr><th>#</th><th>问题</th><th>结果</th><th style="text-align:right">耗时</th>
      <th style="text-align:right">工具</th><th>数据行用量</th><th>文档用量</th></tr></thead>
    <tbody>${items.map(it => `
      <tr class="row" data-id="${esc(it.id)}">
        <td class="id"><input type="checkbox" class="pick" value="${esc(it.id)}"
          onclick="event.stopPropagation()" style="margin-right:6px;vertical-align:-1px">${esc(it.id)}</td>
        <td>${esc(clip(it.question, 52))}
          ${it.probe ? `<div class="probe">${esc(it.probe)}</div>` : ''}
          ${it.problems?.length ? `<div class="why">${esc(it.problems.join('；'))}</div>` : ''}</td>
        <td><span class="pill ${it.ok ? 'ok' : 'no'}">${it.ok ? 'PASS' : 'FAIL'}</span></td>
        <td class="num">${it.elapsed_ms ? (it.elapsed_ms / 1000).toFixed(1) + 's' : '—'}</td>

/* ── 线上质量 ──
   与离线评测最大的不同：这里没有断言，判不了对错。所以整页不出现任何

   没取到证据而拒答、有没有把「现有资料无法确认」标出来、上下文压到了哪、
   一次问答花了多少。把它和离线那档并成一张表，等于用有标准答案的口径

/* 最近问答用**页码翻页**，不用链路追踪那种滚动续读：那边是一条窄列表，

function renderOnlineTable() {
  const total = ONLINE_ITEMS.length;
  const pages = Math.max(1, Math.ceil(total / OSIZE));
  // 每页条数调大后，原来停的页码可能已经越界
  if (OPAGE > pages) OPAGE = pages;
  const from = (OPAGE - 1) * OSIZE;
  const page = ONLINE_ITEMS.slice(from, from + OSIZE);

  // 翻页条的显示门槛看**最小页长**而不是当前页长：否则切到「50 条/页」之后
  // 控件自己消失，想切回 10 条都没地方切
  const pager = total > PAGE_SIZES[0] ? `
    <div class="pager">
      <span class="cnt">共 ${total} 条 · 第 ${OPAGE} / ${pages} 页</span>
      <span class="grow"></span>
      <button class="pg" data-go="-1" ${OPAGE <= 1 ? 'disabled' : ''}>上一页</button>
      <button class="pg" data-go="1" ${OPAGE >= pages ? 'disabled' : ''}>下一页</button>
      <select class="psize">${PAGE_SIZES.map(n =>
        `<option value="${n}"${n === OSIZE ? ' selected' : ''}>${n} 条/页</option>`).join('')}</select>
    </div>` : '';

  $('#otable').innerHTML = `
    <div class="tw"><table>
      <colgroup><col style="width:104px"><col><col style="width:92px"><col style="width:72px">
        <col style="width:58px"><col style="width:66px"><col style="width:84px">
        <col style="width:118px"></colgroup>
      <thead><tr><th>时间</th><th>问题</th><th>状态</th><th style="text-align:right">耗时</th>
        <th style="text-align:right">步数</th><th style="text-align:right">存疑</th>
        <th style="text-align:right">成本</th><th>数据源</th></tr></thead>
      <tbody>${page.map(onlineRow).join('')}</tbody></table></div>${pager}`;

  $('#otable').querySelectorAll('tr.row').forEach(tr => tr.onclick = () => {
    // 带着这一条跳过去，落在追踪页最近一条上等于点了个碰运气的按钮
    FOCUS = Number(tr.dataset.id);
    show('traces');
  });
  $('#otable').querySelectorAll('button.pg').forEach(b => b.onclick = () => {
    OPAGE += Number(b.dataset.go);
    renderOnlineTable();
  });
  const size = $('#otable .psize');
  if (size) size.onchange = () => {
    // 换页长后停在**原来那条记录所在的页**，而不是一律弹回第一页：
    // 正在看第 3 页第 5 条，切成 20 条/页应当还在那条附近
    const anchor = from;
    OSIZE = Number(size.value);
    OPAGE = Math.floor(anchor / OSIZE) + 1;
    renderOnlineTable();
  };
}

/* ── 链路追踪 ── */
async function openTrace(id, cell) {
  if (cell.dataset.loaded) { cell.parentElement.classList.toggle('open'); return; }
  const d = await api('/api/traces/' + id);
  cell.dataset.loaded = '1';
  if (d.error) cell.innerHTML = `<div class="dbox">${esc(d.error)}</div>`;
  else {
    const b = d.budget || {}, s = d.summary || {};
    cell.innerHTML = `<div class="dbox">
      <h4>回答</h4><div class="ans">${text(clip(d.answer, 900)) || '（无）'}</div>
      ${d.unverifiable?.length ? `<h4>现有资料无法确认（${d.unverifiable.length} 项）</h4>
        <div class="ans">${d.unverifiable.map(u => '· ' + text(u)).join('\n')}</div>` : ''}
      <h4>执行链路 · ${s.model_calls || 0} 次模型调用 · ${(s.prompt_tokens || 0) + (s.completion_tokens || 0)} tok
        · ¥${(s.cost_cny || 0).toFixed(4)} · 上下文 ${(b.db_rows_pct ?? 0).toFixed(1)}% 行 /
        ${(b.doc_chars_pct ?? 0).toFixed(1)}% 文档</h4>
      ${pipeline(d.spans || [])}${spanTable(d.spans || [])}</div>`;
  }
  cell.parentElement.classList.add('open');
}
let TRACES = [], CURRENT = null, TRACE_CAP = 50, ANSWER_OF = null;

// 回答在弹层里看完就关，追踪页的滚动位置与选中项都还在
function openAnswer() {
  const d = ANSWER_OF;
  if (!d) return;
  const dlg = $('#ansdlg'), un = d.unverifiable || [];
  dlg.innerHTML = `
    <div class="top2">
      <div style="flex:1;min-width:0">
        <h3>${esc(d.question)}</h3>
        <div class="ids">${esc(d.short_id || '')} · ${
          SRC_LABEL[d.source === 'eval' ? 'eval' : 'online']} · ${esc(d.model || '')} · ${
          esc(d.at || '')} · ${(((d.served_ms ?? d.elapsed_ms) || 0) / 1000).toFixed(2)}s</div>
      </div>
      <button class="x" type="button" aria-label="关闭">✕</button>
    </div>
    <div class="cont">
      <h4>回答</h4>
      <div class="ans">${text(d.answer) || '（本次没有产出回答）'}</div>
      ${un.length ? `<h4 style="margin-top:18px">现有资料无法确认（${un.length} 项）</h4>
        <div class="ans un">${un.map(u => '· ' + text(u)).join('\n')}</div>` : ''}
      ${d.sources?.length ? `<h4 style="margin-top:18px">使用的数据源</h4>
        <div>${d.sources.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div>` : ''}
    </div>`;
  dlg.querySelector('.x').onclick = () => closeAnswer(true);
  dlg.showModal();
}

// 关闭后浏览器会把焦点还给「查看结果」，且按 focus-visible 画出焦点环——
// 用鼠标关的人没在用键盘，那圈描边只是碍眼；ESC 关的留着，那确实是键盘操作。
function closeAnswer(byPointer) {
  $('#ansdlg').close();
  if (byPointer) document.activeElement?.blur?.();
}
// 从「线上质量」的最近问答表点过来时要定位的那一条；用完即清
let FOCUS = null;

/* 滚动分页：先渲染 10 条，滚到底再续 10 条。
   留存上限只有 50 条，一次全渲染也撑得住——但列表是用来**扫**的：
   一屏铺 50 条会把筛选框和最近几条挤出视野，找一条链路反而更慢。
   页大小与留存上限解耦，MAX_TRACES 改大了这里不用跟着改。 */
const PAGE = 10;
let SHOWN = PAGE;

const SRC_LABEL = {online: '线上', eval: '回归'};

function traceRow(t) {
  const srcs = (t.sources || []).map(x => x.replace(/（.*?）/, '')).join('、');
  const src = t.source === 'eval' ? 'eval' : 'online';
  return `<div class="ti${CURRENT === t.id ? ' on' : ''}" data-id="${t.id}">
    <span class="st ${t.status}">${
      t.status === 'SUCCESS' ? '✓' : t.status === 'FAILED' ? '✕' : '!'}</span>
    <span class="tmain">
      <span class="hdr"><span class="q">${esc(t.question)}</span>
        <span class="src ${src}">${SRC_LABEL[src]}</span>
        <span class="sid">${esc((t.short_id || '').slice(0, 6))}</span></span>
      <span class="meta" title="${esc(srcs)}">${esc(t.at || '')} · ${
        (((t.served_ms ?? t.elapsed_ms) || 0) / 1000).toFixed(2)}s · ${esc(srcs || '—')}</span>
    </span></div>`;
}

/** 顶部导航条。计数取**全部留存**（不跟着筛选走）——它回答的是"这批里有多少"，
 *  筛选状态用高亮表示。点一下按筛选，再点一下取消。 */
function renderTraceNav(capacity) {
  const box = $('#tnav');
  if (!box) return;
  const n = f => TRACES.filter(f).length;
  const org = $('#torg')?.value || '', st = $('#tst')?.value || '';
  const chip = (label, count, kind, val, cur, cls) =>
    `<button class="fchip ${cls || ''}${cur === val ? ' on' : ''}" data-k="${kind}" data-v="${val}"
      ${count ? '' : 'disabled'}>${label}<b>${count}</b></button>`;

  box.innerHTML = `<div class="tnav">
    <span class="seg"><span>留存</span><b>${TRACES.length}</b><span class="u">/ ${capacity}</span></span>
    <span class="bar"></span>
    ${chip('线上', n(t => (t.source || 'online') === 'online'), 'org', 'online', org)}
    ${chip('回归', n(t => t.source === 'eval'), 'org', 'eval', org)}
    <span class="bar"></span>
    ${chip('降级', n(t => t.status === 'DEGRADED'), 'st', 'DEGRADED', st, 'warn')}
    ${chip('失败', n(t => t.status === 'FAILED'), 'st', 'FAILED', st, 'crit')}
    ${org || st ? '<button class="fchip clear" data-k="clear" data-v="">清除筛选</button>' : ''}
    <span class="grow"></span>
    <span class="at">最近一条 ${esc(TRACES[0]?.at || '—')}</span>
  </div>`;

  box.querySelectorAll('.fchip').forEach(b => b.onclick = () => {
    const sel = {org: '#torg', st: '#tst'}[b.dataset.k];
    if (b.dataset.k === 'clear') { $('#torg').value = ''; $('#tst').value = ''; }
    // 再点一次同一个 = 取消，不用去下拉框里找"全部"
    else $(sel).value = $(sel).value === b.dataset.v ? '' : b.dataset.v;
    resetList();
  });
}

function renderList() {
  const kw = ($('#tq')?.value || '').trim().toLowerCase();
  const st = $('#tst')?.value || '';
  const sc = $('#tsrc')?.value || '';
  // 来源：线上问答与回归跑测的链路同在这一个列表里，要能只看其中一批
  const og = $('#torg')?.value || '';
  const hit = TRACES.filter(t =>
    (!kw || t.question.toLowerCase().includes(kw) || (t.short_id || '').includes(kw)) &&
    (!st || t.status === st) &&
    (!og || (t.source || 'online') === og) &&
    (!sc || (t.sources || []).some(x => x.includes(sc))));
  // 选中的那一条必须落在窗口里。从线上质量跳过来的可能排在第 30 条，
  // 渲染不到它就会变成：右边详情已经换了，左边一行高亮都没有。
  const at = hit.findIndex(t => t.id === CURRENT);
  if (at >= SHOWN) SHOWN = Math.ceil((at + 1) / PAGE) * PAGE;

  const page = hit.slice(0, SHOWN), rest = hit.length - page.length;
  const foot = rest ? `<div class="more">下滑续读 · 已显示 ${page.length} / ${hit.length}</div>`
             : hit.length > PAGE ? `<div class="more done">已显示全部 ${hit.length} 条</div>` : '';
  $('#tlist').innerHTML = hit.length ? page.map(traceRow).join('') + foot
    : '<div class="none">没有匹配的执行记录</div>';
  $('#tlist').querySelectorAll('.ti').forEach(el =>
    el.onclick = () => selectTrace(Number(el.dataset.id)));
  // 下拉框也能改筛选，导航条的高亮得跟着走
  renderTraceNav(TRACE_CAP);
}

/** 改筛选条件即回到第一页。不复位的话，筛完只剩 3 条时窗口还停在 30，
 *  下次清空筛选又会一口气铺出 30 条——分页等于没做。 */
function resetList() {
  SHOWN = PAGE;
  renderTraceNav(TRACE_CAP);
  renderList();
  const list = $('#tlist');
  if (list) list.scrollTop = 0;
}

async function selectTrace(id) {
  CURRENT = id;
  renderList();
  // 已经在视野里就不动（block:'nearest'）；跳过来的那条在窗口深处时才滚
  $(`#tlist .ti[data-id="${id}"]`)?.scrollIntoView({block: 'nearest'});
  const box = $('#tdetail');
  box.innerHTML = '<div class="dt"><p style="color:var(--muted);font-size:13px">加载中…</p></div>';
  const d = await api('/api/traces/' + id);
  if (d.error) { box.innerHTML = `<div class="dt"><p>${esc(d.error)}</p></div>`; return; }
  ANSWER_OF = d;
  const s = d.summary || {}, b = d.budget || {};
  const steps = (d.spans || []).filter(x => TOOL_KINDS.includes(x.kind)).length;
  const badges = [
    `<span class="bd ${d.status === 'SUCCESS' ? 'ok' : d.status === 'FAILED' ? 'crit' : 'warn'}">${
      d.status}</span>`,
    s.model_failures ? `<span class="bd crit">MODEL FAIL ×${s.model_failures}</span>` : '',
    `<span class="bd">${steps > 1 ? 'MULTI-STEP' : 'SINGLE-STEP'} ×${steps}</span>`,
    s.tool_failures ? `<span class="bd crit">TOOL FAIL ×${s.tool_failures}</span>` : '',
    /* 护栏拦下的调用与工具失败分开报：前者是红线生效，后者是工具坏了 */
    s.tool_refused ? `<span class="bd warn">护栏拦截 ×${s.tool_refused}</span>` : '',
    d.unverifiable?.length ? `<span class="bd warn">无法确认 ${d.unverifiable.length} 项</span>` : '',
  ].filter(Boolean).join('');

  box.innerHTML = `
    <div class="dt">
      <div class="qline"><h3>${esc(d.question)}</h3>${
        (d.answer || d.unverifiable?.length)
          ? '<button class="viewbtn" type="button" onclick="openAnswer()">查看结果</button>' : ''}</div>
      <div class="ids">${esc(d.short_id || '')} · ${
        SRC_LABEL[d.source === 'eval' ? 'eval' : 'online']} · ${esc(d.model || '')} · ${esc(d.at || '')}
        · <span title="${esc(budgetTitle(b))}">语料覆盖 ${(b.db_rows_pct ?? 0).toFixed(1)}% 行 / ${
          (b.doc_chars_pct ?? 0).toFixed(1)}% 文档</span>${
          b.refusals ? ` · <span class="warn" title="被拒绝的取证不计入上面的覆盖率">护栏拒绝 ${
            b.refusals} 次，试图压到 ${b.peak_attempt_db_rows_pct ?? 0}% 行</span>` : ''}</div>
      <div class="badges">${badges}</div>
    </div>
    ${d.notes?.length ? `<div class="anom">
      <div class="t">${d.status === 'FAILED' ? '本次链路中断，未产出回答' : '本次链路未按主路径完成'}</div>
      <ul>${d.notes.map(n => `<li><b>${esc(n.kind)}</b>：${esc(clip(n.text, 240))}</li>`).join('')}</ul>
    </div>` : ''}
    <div class="strip">
      <div><b>总耗时</b><div class="v" title="${esc(elapsedTitle(d))}">${
        ((d.served_ms ?? d.elapsed_ms) / 1000).toFixed(2)}s</div>
        <div class="x mute">${s.span_count || 0} span${
          d.served_ms && d.elapsed_ms ? ' · 收口 ' + (d.served_ms - d.elapsed_ms) + 'ms' : ''}</div></div>
      <div><b>模型调用</b><div class="v">${s.model_calls || 0}</div>
        <div class="x${s.model_failures ? '' : ' mute'}">${
          s.model_failures ? s.model_failures + ' 失败' : '全部成功'}</div></div>
      <div><b>Token</b><div class="v">${(s.prompt_tokens || 0) + (s.completion_tokens || 0)}</div>
        <div class="x${s.usage_missing_calls ? ' bad' : ' mute'}"${
          s.usage_missing_calls ? ' title="失败的调用同样计费，但流式被打断时拿不到用量，这里不拿零冒充"' : ''}>缓存命中 ${
          s.cached_tokens || 0}${s.usage_missing_calls ? ` · ${s.usage_missing_calls} 次未计量` : ''}</div></div>
      <div><b>工具调用</b><div class="v">${s.tool_calls || 0}</div>
        <div class="x mute">${
          /* 失败标红、护栏拒绝标黄：一个是工具坏了，一个是红线生效，同色会读成一回事 */
          [s.tool_failures ? `<b class="bad">${s.tool_failures} 失败</b>` : '',
           s.tool_refused ? `<b class="warn" title="护栏按上下文红线拒绝放行，工具本身跑通了 —— 不计入失败，也不进成功率的分母">${
             s.tool_refused} 护栏拒绝</b>` : '',
           (!s.tool_failures && !s.tool_refused) ? '全部成功' : ''].filter(Boolean).join(' · ')}</div></div>
      <div><b>成本</b><div class="v">¥${(s.cost_cny || 0).toFixed(4)}</div>
        ${priceNote(d.price_basis)}</div>
    </div>
    <div class="dsec">
      <h4 style="font-size:9.5px;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;
        color:var(--muted);margin:0 0 10px;font-weight:600">执行流水线</h4>
      ${pipeline(d.spans || [])}
      <h4 style="font-size:9.5px;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;
        color:var(--muted);margin:14px 0 10px;font-weight:600">Span 明细</h4>
      ${spanTable(d.spans || [])}
    </div>`;
}

/** 成本那一格的小字。价目表外的模型会落到兜底价，那是估算不是账单，必须说出来。 */
function priceNote(pb) {
  if (!pb || !pb.model) return '<div class="x mute">按官方单价</div>';
  if (pb.known) return `<div class="x mute" title="${esc(pb.model)} · 入 ${pb.input_per_1k} / 出 ${
    pb.output_per_1k} / 缓存 ${pb.cached_input_per_1k} 元每千 token">按官方单价 · ${esc(pb.checked_at)} 核对</div>`;
  return `<div class="x warn" title="${esc(pb.model)} 不在已核对的价目表里${
    pb.overridden ? '（单价被环境变量覆盖）' : '，按兜底单价估算'}：入 ${pb.input_per_1k} / 出 ${
    pb.output_per_1k} / 缓存 ${pb.cached_input_per_1k}">${pb.overridden ? '按覆盖单价' : '估算 · 单价未核对'}</div>`;
}

/** 总耗时的悬停说明：链路收口那一刻之后还有解析、核实清单、接地校验。 */
function elapsedTitle(d) {
  if (!d.served_ms || !d.elapsed_ms) return '链路耗时';
  return `端到端 ${(d.served_ms / 1000).toFixed(2)}s = 链路 ${
    (d.elapsed_ms / 1000).toFixed(2)}s + 收口 ${d.served_ms - d.elapsed_ms}ms（解析三段 / 核实清单 / 接地校验）`;
}

/** 上下文那一行的悬停说明：覆盖是去重的，取回不是，两个数都要给。 */
function budgetTitle(b) {
  if (!b || b.db_rows_total == null) return '';
  return [`语料覆盖（去重）：${b.db_rows} / ${b.db_rows_total} 行 · ${b.doc_chars} / ${b.doc_chars_total} 字符`,
    `累计取回（含重复）：${b.db_rows_drawn ?? b.db_rows} 行 · ${b.doc_chars_drawn ?? b.doc_chars} 字符`,
    `工具返回注入上下文：${b.context_chars ?? '—'} 字符（含 JSON 结构与结论文本，不是语料原文）`,
    `红线：${b.limit_rows} 行 / ${b.limit_chars} 字符，两档任一超限即拒绝取证`,
    /* 被拒的那次不进用量：不单独说一句，覆盖率会看着像"从没接近过红线" */
    b.refusals ? `护栏拒绝 ${b.refusals} 次，被拒时试图压到 ${
      b.peak_attempt_db_rows_pct ?? 0}% 行 / ${b.peak_attempt_doc_chars_pct ?? 0}% 文档（未计入上面的覆盖率）`
      : ''].filter(Boolean).join('\n');
}

async function loadTraces() {
  const d = await api('/api/traces'), box = $('#v-traces'), s = d.stats || {};
  if (!s.count) {
    box.innerHTML = `<p class="empty">进程内暂无链路记录。<br><br>到
      <a href="/">问答页</a>提一个问题，或在「Agent 质量中心 · 离线评测」里点运行，这里就会出现完整的 span 明细。</p>`;
    return;
  }
  TRACES = d.items;
  const srcs = [...new Set(d.items.flatMap(t => (t.sources || [])
    .map(x => x.replace(/（.*?）/, ''))))];

  TRACE_CAP = s.capacity || 50;
  box.innerHTML = `
    <section class="blk">${hd('链路概况', '进程内留存 · 重启即清空 · 聚合指标看 Agent 质量中心')}
      <div id="tnav"></div></section>

    <div class="md">
      <div class="panel">
        <div class="ph"><div class="t">最近执行<span class="live">LIVE</span></div>
          <div class="d">点击查看节点级 Span</div></div>
        <div class="filters">
          <input id="tq" placeholder="搜索问题或 Trace ID…">
          <div class="two">
            <select id="tst"><option value="">全部状态</option>
              <option value="SUCCESS">SUCCESS</option><option value="DEGRADED">DEGRADED</option>
              <option value="FAILED">FAILED</option></select>
            <select id="tsrc"><option value="">全部数据源</option>${
              srcs.map(x => `<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select>
          </div>
          <select id="torg"><option value="">线上 + 回归</option>
            <option value="online">只看线上问答</option>
            <option value="eval">只看回归跑测</option></select>
        </div>
        <div class="tlist" id="tlist"></div>
      </div>
      <div class="panel" id="tdetail"></div>
    </div>`;

  ['#tq', '#tst', '#tsrc', '#torg'].forEach(sel => {
    const el = $(sel);
    el.oninput = resetList; el.onchange = resetList;
  });

  // 滚到距底 48px 以内就续下一页。阈值不设 0：等滚到贴底才加载，
  // 惯性滚动会先撞一下底再弹回来，看着像卡住了。
  const list = $('#tlist');
  list.onscroll = () => {
    if (SHOWN >= TRACES.length) return;
    if (list.scrollTop + list.clientHeight >= list.scrollHeight - 48) {
      SHOWN += PAGE;
      renderList();
    }
  };

  SHOWN = PAGE;
  renderList();
  // 从线上质量带过来的那一条优先；它可能已被新记录挤出留存，回退到最近一条
  const focus = FOCUS && TRACES.some(t => t.id === FOCUS) ? FOCUS : d.items[0].id;
  FOCUS = null;
  selectTrace(focus);
}

/* ── 视图切换 ──
   三个视图、两个左轨条目：质量中心的两档（离线评测 / 线上质量）共用一个
   导航位，用分段控件切换。nav 字段决定左轨哪一条高亮，tab 字段决定分段
   控件选中哪一格；tab 为空即不是质量中心，分段控件整个收起。
   hash 仍是每个视图各一个（#eval / #online / #traces），刷新与收藏都落回原处。 */
const VIEW = {
  eval:   {t: 'Agent 质量中心', nav: 'quality', tab: 'eval',   load: loadEval,
           s: '离线评测 · 固定用例与断言判出来的对错，数据来自 eval/run.py 的落盘产物'},
  online: {t: 'Agent 质量中心', nav: 'quality', tab: 'online', load: loadOnline,
           s: '线上质量 · 用户在问答页真实问出来的那些，没有标准答案，只看系统留下的痕迹'},
  traces: {t: '链路追踪', nav: 'traces', tab: '', load: loadTraces,
           s: '逐段复核 agent 的执行过程，线上与回归的链路都在这里，进程内留存'},
};
// 左轨点回质量中心时停在上一次看的那一档——切到追踪页再切回来被打回离线档，
// 等于把人正在看的东西换掉了
let QTAB = 'eval';

function show(name) {
  if (!VIEW[name]) name = 'eval';
  const v = VIEW[name];
  if (v.tab) QTAB = name;
  document.querySelectorAll('.nav button').forEach(b =>
    b.classList.toggle('on', b.dataset.nav === v.nav));
  Object.keys(VIEW).forEach(k =>
    $('#v-' + k).style.display = k === name ? '' : 'none');
  $('#qtabs').style.display = v.tab ? '' : 'none';
  document.querySelectorAll('#qtabs button').forEach(b =>
    b.classList.toggle('on', b.dataset.t === v.tab));
  $('#vtitle').textContent = v.t;
  $('#vsub').textContent = v.s;
  // 执行入口与执行进度条都只属于离线评测：跑的是 eval/ 下的固定用例，与线上流量无关
  ['#runAll', '#runSel'].forEach(sel => $(sel).style.display = name === 'eval' ? '' : 'none');
  $('#runbar')?.classList.toggle('hide', name !== 'eval');
  if (location.hash !== '#' + name) history.replaceState(null, '', '#' + name);
  v.load();
}
document.querySelectorAll('.nav button').forEach(b =>
  b.onclick = () => show(b.dataset.nav === 'quality' ? QTAB : b.dataset.v));
document.querySelectorAll('#qtabs button').forEach(b => b.onclick = () => show(b.dataset.t));
// 直接改地址栏里的 hash（或按浏览器后退）也要换页——三个视图各有一个 hash，
// 只在首次加载时读一次的话，贴给别人的 #online 链接在已开着的页面上点不动
window.addEventListener('hashchange', () => {
  const next = location.hash.slice(1);
  if (VIEW[next]) show(next);
});

/* ── 现场执行 ── */
// 与命令行 eval/run.py 走同一套判定（eval/verdict.py），结果同样落盘。
function wireRun() {
  const bar = document.createElement('div');
  bar.className = 'runbar'; bar.id = 'runbar';
  bar.innerHTML = `<div class="h"><span id="rtitle">正在执行</span><span id="rcount"></span></div>
    <div class="cur" id="rcur"></div><div class="prog"><i id="rbar"></i></div>
    <div class="rlog" id="rlog"></div>`;
  $('.body').insertBefore(bar, $('#v-eval'));

  const run = async ids => {
    const btns = document.querySelectorAll('button.run');
    btns.forEach(b => b.disabled = true);
    show('eval'); bar.classList.add('on');
    $('#rlog').innerHTML = ''; $('#rbar').style.width = '0'; $('#rtitle').textContent = '正在执行';
    let total = 0, done = 0, passed = 0;
    try {
      const r = await fetch('/api/eval/run', {method: 'POST',
        headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ids})});
      const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
      for (;;) {
        const {value, done: fin} = await reader.read();
        if (fin) break;
        buf += dec.decode(value, {stream: true});
        const parts = buf.split('\n\n'); buf = parts.pop();
        for (const p of parts) {
          const line = p.split('\n').find(l => l.startsWith('data:'));
          if (!line) continue;
          const ev = JSON.parse(line.slice(5).trim());
          if (ev.type === 'begin') { total = ev.total; $('#rcount').textContent = `0 / ${total}`; }
          else if (ev.type === 'running') {
            $('#rcur').textContent = `${ev.id}　${ev.question.slice(0, 56)}`;
            const row = document.querySelector(`#v-eval tr.row[data-id="${ev.id}"]`);
            if (row) { row.classList.add('running'); row.scrollIntoView({block: 'center', behavior: 'smooth'}); }
          } else if (ev.type === 'case') {
            done++; if (ev.ok) passed++;
            $('#rcount').textContent = `${done} / ${total}　通过 ${passed}`;
            $('#rbar').style.width = (done / total * 100) + '%';
            const row = document.querySelector(`#v-eval tr.row[data-id="${ev.id}"]`);
            if (row) { row.classList.remove('running'); row.classList.add(ev.ok ? 'just-pass' : 'just-fail'); }
            $('#rlog').insertAdjacentHTML('afterbegin',
              `<div><b class="${ev.ok ? 'p' : 'f'}">${ev.ok ? 'PASS' : 'FAIL'}</b> ${esc(ev.id)}　${
                ev.elapsed_ms ? (ev.elapsed_ms / 1000).toFixed(1) + 's' : '—'}　${ev.steps ?? '—'} 步　${
                ev.tokens || '—'} tok　${ev.cost_cny != null ? '¥' + ev.cost_cny.toFixed(4) : '—'}${
                ev.problems?.length ? '　' + esc(ev.problems.join('；')) : ''}</div>`);
          } else if (ev.type === 'done') {
            $('#rtitle').textContent = passed === total ? '全部通过' : '执行完成';
            $('#rcur').textContent = '指标已更新';
            await loadEval();
          } else if (ev.type === 'error') {
            $('#rtitle').textContent = '执行失败'; $('#rcur').textContent = ev.error;
          }
        }
      }
    } catch (e) {
      $('#rtitle').textContent = '执行中断'; $('#rcur').textContent = String(e);
    } finally { btns.forEach(b => b.disabled = false); }
  };
  $('#runAll').onclick = () => run([]);
  $('#runSel').onclick = () => {
    const ids = [...document.querySelectorAll('#v-eval input.pick:checked')].map(i => i.value);
    if (!ids.length) { alert('请先在用例表里勾选要执行的条目'); return; }
    run(ids);
  };
}

// 点半透明背景也关掉：dialog 元素本身就是那块背景的命中区域
$('#ansdlg').addEventListener('click', e => { if (e.target === $('#ansdlg')) closeAnswer(true); });

wireRun();
show((location.hash || '#eval').slice(1));
</script>
